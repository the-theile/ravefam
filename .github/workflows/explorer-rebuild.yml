name: explorer-rebuild

# Rebuilds the Lineup Explorer pages from Supabase (the source of truth) and
# commits to main only when the data changed. The lineup scout writes to
# Supabase; this picks it up. Cheap when idle: one RPC call, then exit.
#
# Needs repo secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
# Run by hand: Actions tab -> explorer-rebuild -> Run workflow
# (tick "dry_run" to only print what would change).

on:
  schedule:
    - cron: '17 * * * *'   # hourly
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print planned changes'
        type: boolean
        default: false
      force:
        description: 'Rebuild even if the data version is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: explorer-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages from Supabase
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repo secrets."
            exit 1
          fi
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          node _ops/explorer/build-explorer.mjs $args | tee build.log
          summary=$(grep '^SUMMARY ' build.log | tail -1 | cut -c9-)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          { echo '### Explorer rebuild'; echo '```'; grep -v '^SUMMARY ' build.log | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changed pages
        if: ${{ inputs.dry_run != true }}
        env:
          SUMMARY: ${{ steps.gen.outputs.summary }}
        run: |
          # Commit only when a page changed (a new data_version alone isn't worth a deploy).
          pages=$(node -e 'try{const j=JSON.parse(process.env.SUMMARY||"{}");if(j.changed)console.log((j.pages||[]).join(", "))}catch{}')
          if [ -z "$pages" ]; then
            echo "No page changes."
            exit 0
          fi
          git config user.name "ravefam-explorer-bot"
          git config user.email "explorer-bot@users.noreply.github.com"
          git add lineup-explorer sitemap.xml sitemap-artists.xml
          git commit -m "Lineup Explorer: rebuild from Supabase${pages:+ ($pages)}" -m "Generated by .github/workflows/explorer-rebuild.yml from public.explorer_snapshot()."
          git push
